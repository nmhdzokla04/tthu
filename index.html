<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiệp Trung Thu 💗</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
body{cursor:default}
#space{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(circle at 50% 45%,rgba(255,105,210,.07),transparent 30%),
 #000}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,220,.65);animation:twinkle 2.5s infinite alternate}
@keyframes twinkle{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}

.message{
 position:absolute;color:#ff83dc;font-weight:700;white-space:nowrap;
 text-shadow:0 0 5px #ff49c7,0 0 14px #ff49c7,0 0 28px #ff159e;
 user-select:none;pointer-events:none;
 animation:float 10s ease-in-out infinite alternate;
}
@keyframes float{from{transform:translate3d(0,8px,0) rotate(-2deg)}
to{transform:translate3d(0,-12px,0) rotate(2deg)}}

.photo{
 position:absolute;width:185px;height:235px;padding:10px 10px 28px;
 background:#e9dfd9;border-radius:5px;
 box-shadow:0 12px 35px rgba(255,70,190,.25),0 0 22px rgba(255,110,220,.2);
 transform-style:preserve-3d;animation:photoFloat 7s ease-in-out infinite alternate;
}
.photo .pic{width:100%;height:100%;border-radius:2px;overflow:hidden;position:relative;
 background:linear-gradient(145deg,#5a3d50,#dca4bd 45%,#8c6579)}
.photo .pic:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 52% 35%,#f0c0c9 0 12%,transparent 13%),
 radial-gradient(ellipse at 52% 55%,#4c3141 0 22%,transparent 23%),
 linear-gradient(145deg,transparent 0 55%,rgba(255,255,255,.16) 56% 70%,transparent 71%);
 opacity:.8}
.photo .caption{position:absolute;bottom:4px;left:0;right:0;text-align:center;color:#777;font-size:11px}
.p1{left:7%;top:8%;transform:rotate(-3deg);animation-delay:-1s}
.p2{left:40%;top:54%;transform:rotate(2deg) scale(.78);animation-delay:-3s}
.p3{right:7%;top:17%;transform:rotate(5deg) scale(.58);animation-delay:-2s}
.p4{right:25%;top:53%;transform:rotate(-5deg) scale(.62);animation-delay:-4s}
@keyframes photoFloat{to{translate:0 -12px;rotate:1deg}}

.lantern{
 position:absolute;width:72px;height:90px;border-radius:48% 48% 42% 42%;
 background:radial-gradient(circle at 50% 38%,#fff49a 0 6%,#ffb126 18%,#ff641c 55%,#d42b0b 100%);
 box-shadow:0 0 22px #ff7b1b,0 0 55px rgba(255,100,20,.7);
 animation:lantern 5s ease-in-out infinite alternate;
}
.lantern:before{content:"";position:absolute;left:50%;top:-22px;width:2px;height:24px;background:#e7b873}
.lantern:after{content:"";position:absolute;left:8px;right:8px;top:8px;bottom:8px;border-left:2px solid rgba(255,239,160,.35);border-right:2px solid rgba(255,239,160,.35);border-radius:50%}
.l1{left:49%;top:27%}.l2{left:25%;bottom:-18px;transform:scale(.75)}.l3{right:36%;bottom:-18px;transform:scale(.55)}
@keyframes lantern{to{translate:8px -15px}}

.moon{
 position:absolute;left:50%;top:30%;width:72px;height:72px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#ffd75c,#ff9a28 55%,#ff5e17);
 box-shadow:0 0 25px #ff9b36,0 0 60px rgba(255,135,35,.55);
 animation:moonFloat 5s ease-in-out infinite alternate;
}
.moon:after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,#ffb23b 0 18%,transparent 19%),radial-gradient(circle at 70% 70%,#e87723 0 10%,transparent 11%);opacity:.55}
@keyframes moonFloat{to{transform:translate(10px,-12px)}}

.music{
 position:fixed;right:18px;top:17px;color:white;font-size:25px;z-index:10;
 text-shadow:0 0 12px #fff;cursor:pointer
}
.heart{position:fixed;right:68px;top:17px;font-size:27px;filter:drop-shadow(0 0 8px #ff4ecb);animation:pulse 1.3s infinite}
.gift{position:fixed;right:20px;top:54px;font-size:27px;filter:drop-shadow(0 0 8px #ff4ecb)}
@keyframes pulse{50%{transform:scale(1.18)}}

.center{
 position:fixed;left:50%;top:39%;transform:translate(-50%,-50%);
 text-align:center;color:#ff86dc;z-index:5;pointer-events:none
}
.center .name{font-size:28px;font-weight:800;text-shadow:0 0 8px #ff4cc7,0 0 24px #ff28b5}
.center .wish{font-size:17px;margin-top:8px;text-shadow:0 0 8px #ff4cc7,0 0 18px #ff28b5}

.start{
 position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
 background:#000;transition:opacity .8s;cursor:pointer
}
.start button{
 border:1px solid #ff79d8;background:rgba(255,80,190,.08);color:#ff9ce4;
 padding:14px 25px;border-radius:999px;font-size:18px;
 box-shadow:0 0 15px #ff35bd, inset 0 0 15px rgba(255,70,190,.15)
}
.hidden{opacity:0;pointer-events:none}
.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#ff8add99;font-size:12px}
@media(max-width:700px){
 .photo{width:125px;height:165px}.p1{left:2%}.p3{right:0}.center .name{font-size:23px}
 .message{font-size:14px!important}
}
</style>
</head>
<body>
<div id="space"></div>

<div class="start" id="start" onclick="enter()">
  <button>💗 Mở thiệp Trung Thu 💗</button>
</div>

<div class="music" id="music" title="Bật/tắt nhạc" onclick="toggleMusic()">🔊</div>
<div class="heart">💖</div>
<div class="gift">🎁</div>

<div class="photo p1"><div class="pic"></div><div class="caption">Một chút dịu dàng 💗</div></div>
<div class="photo p2"><div class="pic"></div><div class="caption">Thương em rất nhiều</div></div>
<div class="photo p3"><div class="pic"></div><div class="caption">Minh Châu ✨</div></div>
<div class="photo p4"><div class="pic"></div><div class="caption">I love you</div></div>

<div class="moon"></div>
<div class="lantern l1"></div><div class="lantern l2"></div><div class="lantern l3"></div>

<div class="center">
  <div class="name">🐶 Minh Châu</div>
  <div class="wish">trung thu vui vẻ · i love you · iu em nhiều lắm 💗</div>
</div>

<div class="hint">Chạm/click để mở · nhạc nền có thể bật/tắt</div>

<script>
const texts=[
 "trung thu vui vẻ","i love you","iu em nhiều lắm","Minh Châu",
 "cảm ơn em vì tất cả","chúc em thật nhiều may mắn","thương em nhiều lắm",
 "trung thu vui vẻ nhé","cảm ơn em vì đã bên anh","iu em nhất",
 "chúc em bình an","mong em luôn vui vẻ","💗","Minh Châu"
];
const space=document.getElementById('space');
for(let i=0;i<75;i++){
 const s=document.createElement('span'); s.className='star';
 const size=Math.random()*3+1;
 s.style.width=s.style.height=size+'px';
 s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
 s.style.animationDelay=(Math.random()*3)+'s';
 space.appendChild(s);
}
texts.forEach((t,i)=>{
 const e=document.createElement('div'); e.className='message'; e.textContent=t;
 e.style.left=(4+Math.random()*90)+'%'; e.style.top=(3+Math.random()*90)+'%';
 e.style.fontSize=(14+Math.random()*14)+'px';
 e.style.opacity=.55+Math.random()*.45;
 e.style.animationDelay=(-Math.random()*10)+'s';
 e.style.animationDuration=(7+Math.random()*8)+'s';
 space.appendChild(e);
});

let audioCtx, playing=false, timer;
function enter(){
 document.getElementById('start').classList.add('hidden');
 startMusic();
}
function startMusic(){
 if(playing)return;
 try{
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   const gain=audioCtx.createGain(); gain.gain.value=.035; gain.connect(audioCtx.destination);
   const notes=[261.63,329.63,392,329.63,293.66,349.23,440,392];
   let n=0;
   timer=setInterval(()=>{
     const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=notes[n++%notes.length];
     o.connect(gain); o.start(); o.stop(audioCtx.currentTime+.55);
   },620);
   playing=true; document.getElementById('music').textContent='🔊';
 }catch(e){}
}
function toggleMusic(){
 if(!playing){startMusic();return}
 clearInterval(timer); playing=false; document.getElementById('music').textContent='🔇';
 if(audioCtx) audioCtx.suspend();
}
</script>
</body>
</html>
