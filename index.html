<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kimanhiudau 💗</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#25104d 0,#080611 42%,#020208 100%);color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center}.stars{position:fixed;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#fff 1px,transparent 1px);background-size:90px 90px,137px 137px;background-position:10px 20px,40px 70px;opacity:.45;animation:stars 8s linear infinite}.wrap{position:relative;z-index:2;text-align:center;width:min(92vw,720px)}h1{font-size:clamp(32px,8vw,72px);margin:0 0 8px;text-shadow:0 0 10px #ff3cac,0 0 30px #ff3cac;animation:float 3s ease-in-out infinite}.sub{font-size:18px;opacity:.9;margin-bottom:25px}.scene{height:410px;perspective:1100px;display:grid;place-items:center}.card{width:min(260px,58vw);height:min(340px,70vw);position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite,hover 3.2s ease-in-out infinite;filter:drop-shadow(0 20px 30px #ff39a955)}.card img{width:100%;height:100%;object-fit:cover;border-radius:22px;border:3px solid #ff9bdf;box-shadow:0 0 20px #ff39a9,0 0 55px #ff39a966;backface-visibility:hidden}.back{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4ab8,#6b28ff);border:3px solid #fff;transform:rotateY(180deg);backface-visibility:hidden;font-size:32px;font-weight:800}.hint{margin:10px 0 18px}.btn{border:1px solid #ff8bd5;background:#ff3ca622;color:#fff;border-radius:999px;padding:13px 22px;font-size:16px;cursor:pointer;box-shadow:0 0 18px #ff3ca966}.btn:hover{background:#ff3ca644}.heart{position:fixed;z-index:1;font-size:22px;animation:rise linear infinite;opacity:.8}@keyframes spin{from{transform:rotateX(10deg) rotateY(0deg) rotateZ(-4deg)}to{transform:rotateX(370deg) rotateY(360deg) rotateZ(356deg)}}@keyframes hover{0%,100%{margin-top:0}50%{margin-top:-32px}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes rise{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}@keyframes stars{to{background-position:110px 120px,0 0}}audio{display:none}.badge{font-size:13px;opacity:.65;margin-top:12px}</style></head><body><div class="stars"></div><div class="wrap"><h1>kimanhiudau 💗</h1><div class="sub">Một góc nhỏ dành cho em ✨</div><div class="scene"><div class="card"><img src="photo1.jpg" alt="Ảnh kỷ niệm"><div class="back">💗<br>Yêu em</div></div></div><div class="hint">🌀 Ảnh đang xoay 3D + lơ lửng</div><button class="btn" id="musicBtn">▶️ Phát nhạc</button><div class="badge">Bấm nút để trình duyệt cho phép phát nhạc.</div></div><div class="heart" style="left:8%;animation-duration:9s">💗</div><div class="heart" style="left:24%;animation-duration:12s;animation-delay:-4s">💕</div><div class="heart" style="left:72%;animation-duration:10s;animation-delay:-6s">💖</div><div class="heart" style="left:88%;animation-duration:13s;animation-delay:-2s">💗</div><audio id="music" src="music.mp3" loop preload="auto"></audio><script>const b=document.getElementById('musicBtn'),a=document.getElementById('music');b.onclick=async()=>{try{if(a.paused){await a.play();b.textContent='⏸️ Dừng nhạc'}else{a.pause();b.textContent='▶️ Phát nhạc'}}catch(e){b.textContent='⚠️ Không phát được nhạc';console.error(e)}};</script></body></html>
